<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyrillic — Learn Russian</title>
<meta name="description" content="A complete, self-contained Russian learning app: alphabet, reading, vocabulary, grammar, listening and conversation practice.">
<style>
:root{
  --bg:#f4f6fb;
  --bg-elevated:#ffffff;
  --card:#ffffff;
  --card-hover:#fbfcff;
  --border:#e2e6f0;
  --text:#1a2138;
  --text-dim:#5b6478;
  --text-faint:#8890a4;
  --accent:#4a5df0;
  --accent-hover:#3d4fd6;
  --accent-dim:#eaecfe;
  --accent-text:#ffffff;
  --success:#1f9d55;
  --success-bg:#e6f7ec;
  --error:#dc3236;
  --error-bg:#fdeaea;
  --warn:#b9790f;
  --warn-bg:#fdf3e0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 2px 12px rgba(20,30,70,.06);
  --shadow-lg:0 8px 30px rgba(20,30,70,.10);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-ru:"Segoe UI","PT Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme: light;
}
[data-theme="dark"]{
  --bg:#0e1220;
  --bg-elevated:#161c2e;
  --card:#161c2e;
  --card-hover:#1b2236;
  --border:#2a3149;
  --text:#eef1fb;
  --text-dim:#a3abc4;
  --text-faint:#727ba0;
  --accent:#7c8cff;
  --accent-hover:#94a2ff;
  --accent-dim:#242c4a;
  --accent-text:#0e1220;
  --success:#3ecb7e;
  --success-bg:#123320;
  --error:#ff6a6e;
  --error-bg:#3a1c1f;
  --warn:#e3ab52;
  --warn-bg:#3a2e15;
  --shadow:0 2px 16px rgba(0,0,0,.35);
  --shadow-lg:0 10px 40px rgba(0,0,0,.45);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1220; --bg-elevated:#161c2e; --card:#161c2e; --card-hover:#1b2236;
    --border:#2a3149; --text:#eef1fb; --text-dim:#a3abc4; --text-faint:#727ba0;
    --accent:#7c8cff; --accent-hover:#94a2ff; --accent-dim:#242c4a; --accent-text:#0e1220;
    --success:#3ecb7e; --success-bg:#123320; --error:#ff6a6e; --error-bg:#3a1c1f;
    --warn:#e3ab52; --warn-bg:#3a2e15;
    --shadow:0 2px 16px rgba(0,0,0,.35); --shadow-lg:0 10px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:76px;
}
button,input,select,textarea{font-family:inherit;}
a{color:inherit;}
.ru{font-family:var(--font-ru);}
h1,h2,h3,h4{margin:0 0 6px;line-height:1.25;}
p{margin:0 0 10px;}
.hidden{display:none !important;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ---------- Top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;
  background:var(--bg-elevated);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(6px);
}
#topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;letter-spacing:.2px;cursor:pointer;user-select:none;}
#topbar .brand .mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-text);
  font-family:var(--font-ru);font-weight:800;font-size:1rem;
}
#topbar .spacer{flex:1;}
.streak-pill{
  display:flex;align-items:center;gap:5px;font-weight:700;font-size:.85rem;
  padding:5px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn);
  white-space:nowrap;
}
.xp-pill{
  display:flex;align-items:center;gap:5px;font-weight:700;font-size:.85rem;
  padding:5px 10px;border-radius:999px;background:var(--accent-dim);color:var(--accent);
  white-space:nowrap;
}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-elevated);color:var(--text-dim);cursor:pointer;font-size:1rem;
  transition:background .15s,color .15s,border-color .15s;
}
.icon-btn:hover{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-dim);}

/* ---------- Nav ---------- */
#nav{
  display:flex;gap:4px;overflow-x:auto;padding:8px 12px;
  background:var(--bg-elevated);border-bottom:1px solid var(--border);
  position:sticky;top:53px;z-index:39;
  scrollbar-width:none;
}
#nav::-webkit-scrollbar{display:none;}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 12px;border-radius:11px;border:none;background:transparent;
  color:var(--text-dim);cursor:pointer;font-size:.72rem;font-weight:600;
  white-space:nowrap;min-width:60px;flex-shrink:0;
  transition:background .15s,color .15s;
}
.nav-btn .ico{font-size:1.15rem;line-height:1;}
.nav-btn:hover{background:var(--accent-dim);color:var(--accent);}
.nav-btn.active{background:var(--accent);color:var(--accent-text);}

/* ---------- Layout ---------- */
#view-root{max-width:920px;margin:0 auto;padding:18px 16px 40px;}
.view{animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px;
}
.card h3{font-size:1rem;}
.card-row{display:flex;gap:14px;flex-wrap:wrap;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr 1fr;}}
@media (max-width:420px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.stat-tile{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px;text-align:center;
}
.stat-tile .num{font-size:1.5rem;font-weight:800;color:var(--accent);}
.stat-tile .lbl{font-size:.75rem;color:var(--text-dim);margin-top:2px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:12px;border:1px solid var(--border);
  background:var(--bg-elevated);color:var(--text);font-weight:700;font-size:.92rem;
  cursor:pointer;transition:transform .08s,background .15s,border-color .15s;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.btn.primary:hover{background:var(--accent-hover);}
.btn.ghost{background:transparent;}
.btn.block{width:100%;}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:9px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.success{background:var(--success);border-color:var(--success);color:#fff;}

.progress-bar{height:8px;border-radius:99px;background:var(--accent-dim);overflow:hidden;}
.progress-bar > div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;}
.progress-bar.thin{height:5px;}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--accent-dim);color:var(--accent);}
.pill.locked{background:var(--border);color:var(--text-faint);}
.pill.done{background:var(--success-bg);color:var(--success);}
.pill.warn{background:var(--warn-bg);color:var(--warn);}

/* ---------- Dashboard ---------- */
.hero{
  background:linear-gradient(135deg,var(--accent-dim),var(--card));
  border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;
}
.hero .level-name{font-size:1.3rem;font-weight:800;}
.hero .lesson-name{color:var(--text-dim);font-size:.92rem;margin-bottom:12px;}

/* ---------- Letter / vocab cards ---------- */
.letter-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;text-align:center;
}
.letter-big{font-family:var(--font-ru);font-size:4rem;font-weight:800;line-height:1;color:var(--accent);}
.letter-meta{margin-top:10px;font-size:.9rem;color:var(--text-dim);}
.letter-meta b{color:var(--text);}
.example-ru{font-family:var(--font-ru);font-size:1.4rem;font-weight:700;}

.vocab-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;
}
.vocab-ru{font-family:var(--font-ru);font-weight:700;font-size:1.15rem;}
.vocab-tr{color:var(--text-faint);font-size:.82rem;}
.vocab-en{color:var(--text-dim);font-size:.92rem;}

.speak-btn{
  border:1px solid var(--border);background:var(--bg-elevated);color:var(--accent);
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
}
.speak-btn:hover{background:var(--accent-dim);}
.speak-btn:disabled{opacity:.35;cursor:not-allowed;}

/* ---------- Exercise screen ---------- */
#exercise-wrap{max-width:640px;margin:0 auto;}
.ex-progress{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.ex-progress .progress-bar{flex:1;}
.ex-progress .count{font-size:.8rem;color:var(--text-dim);font-weight:700;white-space:nowrap;}
.ex-close{cursor:pointer;color:var(--text-dim);font-size:1.3rem;line-height:1;padding:4px 8px;}

.ex-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 22px;text-align:center;}
.ex-kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin-bottom:10px;}
.ex-prompt{font-family:var(--font-ru);font-size:2.3rem;font-weight:800;margin:6px 0;word-break:break-word;}
.ex-prompt.small{font-size:1.5rem;}
.ex-prompt-en{font-size:1.5rem;font-weight:700;}
.ex-sub{color:var(--text-dim);font-size:.92rem;margin-bottom:6px;}

.ex-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
@media (max-width:480px){.ex-options{grid-template-columns:1fr;}}
.opt-btn{
  padding:14px 12px;border-radius:12px;border:2px solid var(--border);background:var(--bg-elevated);
  color:var(--text);font-weight:600;cursor:pointer;font-size:1rem;text-align:center;
  transition:border-color .12s,background .12s,transform .08s;font-family:var(--font-ru);
}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-dim);}
.opt-btn:active:not(:disabled){transform:scale(.98);}
.opt-btn.correct{border-color:var(--success);background:var(--success-bg);color:var(--success);}
.opt-btn.wrong{border-color:var(--error);background:var(--error-bg);color:var(--error);}
.opt-btn:disabled{cursor:default;}

.ex-input-row{display:flex;gap:10px;margin-top:20px;}
.ex-text-input{
  flex:1;padding:13px 14px;border-radius:12px;border:2px solid var(--border);
  background:var(--bg-elevated);color:var(--text);font-size:1.1rem;font-family:var(--font-ru);
}
.ex-text-input:focus{outline:none;border-color:var(--accent);}
.ex-text-input.correct{border-color:var(--success);}
.ex-text-input.wrong{border-color:var(--error);}

.order-tokens{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;margin:16px 0;padding:10px;border:2px dashed var(--border);border-radius:12px;}
.order-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
.token-btn{
  padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:var(--bg-elevated);
  font-family:var(--font-ru);font-weight:700;font-size:1rem;cursor:pointer;
}
.token-btn:hover{background:var(--accent-dim);}
.token-btn.placed{opacity:.35;cursor:default;}

.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:16px;}
.match-item{
  padding:12px 10px;border-radius:10px;border:2px solid var(--border);background:var(--bg-elevated);
  cursor:pointer;font-size:.95rem;text-align:center;font-family:var(--font-ru);
}
.match-item.left{font-weight:700;}
.match-item.selected{border-color:var(--accent);background:var(--accent-dim);}
.match-item.matched{border-color:var(--success);background:var(--success-bg);color:var(--success);opacity:.7;cursor:default;}
.match-item.mismatch{border-color:var(--error);background:var(--error-bg);}

.feedback-box{margin-top:18px;padding:16px;border-radius:12px;text-align:left;}
.feedback-box.correct{background:var(--success-bg);border:1px solid var(--success);}
.feedback-box.wrong{background:var(--error-bg);border:1px solid var(--error);}
.feedback-title{font-weight:800;font-size:1rem;margin-bottom:4px;}
.feedback-box.correct .feedback-title{color:var(--success);}
.feedback-box.wrong .feedback-title{color:var(--error);}
.feedback-answer{font-family:var(--font-ru);font-weight:700;font-size:1.1rem;margin:4px 0;}
.feedback-explain{color:var(--text-dim);font-size:.88rem;line-height:1.5;}

.ex-footer{margin-top:20px;display:flex;justify-content:flex-end;}

/* ---------- Lesson list ---------- */
.level-block{margin-bottom:22px;}
.level-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.level-header .lvl-num{
  width:30px;height:30px;border-radius:9px;background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0;
}
.level-header h3{font-size:1.02rem;}
.level-header .lvl-sub{font-size:.78rem;color:var(--text-faint);}
.lesson-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;
  border:1px solid var(--border);background:var(--card);margin-bottom:8px;cursor:pointer;
  transition:background .12s;
}
.lesson-item:hover{background:var(--card-hover);}
.lesson-item.locked{opacity:.5;cursor:not-allowed;}
.lesson-item .li-ico{font-size:1.3rem;width:30px;text-align:center;flex-shrink:0;}
.lesson-item .li-body{flex:1;min-width:0;}
.lesson-item .li-title{font-weight:700;font-size:.94rem;}
.lesson-item .li-sub{font-size:.78rem;color:var(--text-faint);}
.check-badge{color:var(--success);font-size:1.2rem;flex-shrink:0;}

/* ---------- Teach cards ---------- */
.teach-card{max-width:560px;margin:0 auto;}
.teach-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
.teach-dots{display:flex;gap:5px;}
.teach-dots span{width:6px;height:6px;border-radius:50%;background:var(--border);}
.teach-dots span.active{background:var(--accent);width:16px;border-radius:4px;}

.grammar-block{margin-bottom:10px;line-height:1.6;font-size:.96rem;color:var(--text-dim);}
.grammar-block b{color:var(--text);}
.example-line{
  background:var(--accent-dim);border-radius:10px;padding:10px 14px;margin:8px 0;
}
.example-line .ru{font-size:1.15rem;font-weight:700;color:var(--text);}
.example-line .tr{color:var(--text-faint);font-size:.82rem;}
.example-line .en{color:var(--text-dim);font-size:.9rem;margin-top:2px;}
.compare-box{display:flex;gap:12px;margin:10px 0;flex-wrap:wrap;}
.compare-box .half{flex:1;min-width:180px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--border);}
.compare-box .half .k{font-size:.72rem;text-transform:uppercase;color:var(--text-faint);font-weight:700;}

/* ---------- Chat / conversation ---------- */
.chat-log{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;min-height:120px;}
.chat-bubble{max-width:78%;padding:11px 15px;border-radius:16px;font-family:var(--font-ru);font-size:1.02rem;line-height:1.4;}
.chat-bubble.bot{background:var(--accent-dim);align-self:flex-start;border-bottom-left-radius:4px;}
.chat-bubble.user{background:var(--accent);color:var(--accent-text);align-self:flex-end;border-bottom-right-radius:4px;}
.chat-bubble .tr{display:block;font-family:var(--font-ui);font-size:.72rem;opacity:.75;margin-top:3px;}
.chat-en{font-size:.78rem;color:var(--text-faint);align-self:inherit;margin-top:-6px;}

/* ---------- misc ---------- */
.section-title{font-size:1.1rem;font-weight:800;margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}
.muted{color:var(--text-dim);font-size:.9rem;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-faint);}
.empty-state .ico{font-size:2.2rem;margin-bottom:8px;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.tag-btn{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--bg-elevated);font-size:.8rem;font-weight:700;cursor:pointer;color:var(--text-dim);}
.tag-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.toast{
  position:fixed;bottom:86px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:.85rem;font-weight:600;z-index:200;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.rate-row{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
.confusion-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.confusion-row:last-child{border-bottom:none;}
.confusion-pair{font-family:var(--font-ru);font-weight:800;font-size:1.1rem;}
table.simple{width:100%;border-collapse:collapse;font-size:.88rem;}
table.simple th,table.simple td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;}
table.simple th{color:var(--text-faint);font-size:.75rem;text-transform:uppercase;}
::selection{background:var(--accent);color:var(--accent-text);}
body.hide-translit .vocab-tr,
body.hide-translit .tr,
body.hide-translit .translit{display:none !important;}
</style>
</head>
<body>

<header id="topbar">
  <div class="brand" data-nav="dashboard"><span class="mark">Я</span><span>Cyrillic</span></div>
  <div class="spacer"></div>
  <div class="streak-pill" id="streak-pill">🔥 <span id="streak-num">0</span></div>
  <div class="xp-pill" id="xp-pill">⭐ <span id="xp-num">0</span></div>
  <button class="icon-btn" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
</header>

<nav id="nav">
  <button class="nav-btn" data-nav="dashboard"><span class="ico">🏠</span>Home</button>
  <button class="nav-btn" data-nav="learn"><span class="ico">📘</span>Learn</button>
  <button class="nav-btn" data-nav="practice"><span class="ico">🎯</span>Practice</button>
  <button class="nav-btn" data-nav="review"><span class="ico">🔁</span>Review</button>
  <button class="nav-btn" data-nav="listening"><span class="ico">🎧</span>Listen</button>
  <button class="nav-btn" data-nav="vocab"><span class="ico">📚</span>Vocab</button>
  <button class="nav-btn" data-nav="grammar"><span class="ico">🧩</span>Grammar</button>
  <button class="nav-btn" data-nav="conversation"><span class="ico">💬</span>Talk</button>
  <button class="nav-btn" data-nav="progress"><span class="ico">📊</span>Progress</button>
</nav>

<main id="view-root">
  <div id="view-dashboard" class="view"></div>
  <div id="view-learn" class="view hidden"></div>
  <div id="view-practice" class="view hidden"></div>
  <div id="view-review" class="view hidden"></div>
  <div id="view-listening" class="view hidden"></div>
  <div id="view-vocab" class="view hidden"></div>
  <div id="view-grammar" class="view hidden"></div>
  <div id="view-conversation" class="view hidden"></div>
  <div id="view-progress" class="view hidden"></div>
  <div id="view-lesson" class="view hidden"></div>
  <div id="view-exercise" class="view hidden"></div>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   DATA — ALPHABET
   ========================================================================= */
const LETTER_GROUPS = [
  {title:"The Easy Start", note:"These five look or sound close to what you already know."},
  {title:"False Friends", note:"These LOOK like English letters but make totally different sounds. This is the #1 trap for beginners — slow down here."},
  {title:"New Sounds", note:"A few new shapes and one classic 'clear your throat' sound."},

  { id:"aspect", level:13, title:"Verb Aspect (Perfective vs. Imperfective)",

      "Often the perfective is just the imperfective with a prefix added: делать (to do, imperfective) → сделать (to do/finish, perfective). It looks like a small change, but it shifts the whole meaning from “in progress” to “done”."

/* =========================================================================
   UTILITIES
   ========================================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sample(arr, n){ return shuffle(arr).slice(0, n); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalizeAnswer(s){
  return String(s||"")
    .trim().toLowerCase()
    .replace(/ё/g,"е")
    .replace(/[.,!?;:()"«»']/g,"")
    .replace(/\s+/g," ");
}
function answerMatches(given, accepted){
  const g = normalizeAnswer(given);
  if(!g) return false;
  const variants = String(accepted).split("/").map(s=>normalizeAnswer(s));
  return variants.includes(g);
}
function todayKey(d){
  d = d || new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function daysSince(ts){ return (Date.now()-ts)/86400000; }
let toastTimer=null;
function toast(msg){
  const el = document.getElementById("toast");
  if(!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

/* =========================================================================
   STORE — localStorage persistence
   ========================================================================= */
const STORAGE_KEY = "cyrillicApp_v1";
const Store = {
  data: null,
  defaults(){
    return {
      version:1,
      xp:0,
      streak:0,
      lastActiveDay:null,
      theme:null,               // null=auto, 'light', 'dark'
      showTranslit:true,
      currentLevel:1,
      lessonProgress:{},        // lessonId -> {completed, bestScore, attempts}
      srs:{},                   // itemId -> {kind, box, due, correct, incorrect, lastReviewed, firstSeen}
      confusion:{},             // "A|B" -> count  (letter confusion pairs)
      vocabMistakes:{},         // vocabId -> count
      conversationProgress:{},  // convId -> {turn, done}
      totalAnswered:0,
      totalCorrect:0,
      createdAt:Date.now()
    };
  },
  load(){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ saved = null; }
    this.data = Object.assign(this.defaults(), saved||{});
    // deep-merge nested objects so new fields survive upgrades
    const d = this.defaults();
    for(const k of ["lessonProgress","srs","confusion","vocabMistakes","conversationProgress"]){
      this.data[k] = Object.assign({}, d[k], (saved && saved[k]) || {});
    }
    this._bumpStreak();
    return this.data;
  },
  save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); }catch(e){ /* storage unavailable */ }
  },
  _bumpStreak(){
    const today = todayKey();
    const last = this.data.lastActiveDay;
    if(last === today) return;
    if(last){
      const gap = Math.round((new Date(today) - new Date(last)) / 86400000);
      if(gap === 1) this.data.streak += 1;
      else if(gap > 1) this.data.streak = 1;
    } else {
      this.data.streak = 1;
    }
    this.data.lastActiveDay = today;
    this.save();
  },
  addXp(n){
    this.data.xp += n;
    this.save();
    if(typeof updateTopbar === "function") updateTopbar();
  },
  reset(){
    localStorage.removeItem(STORAGE_KEY);
    this.load();
  }
};

/* =========================================================================
   SPACED REPETITION (simplified Leitner system)
   ========================================================================= */
const LEITNER_DAYS = [0, 1, 2, 4, 7, 14, 30, 60];
const SRS = {
  ensure(id, kind){
    if(!Store.data.srs[id]){
      Store.data.srs[id] = {kind, box:0, due:Date.now(), correct:0, incorrect:0, lastReviewed:0, firstSeen:Date.now()};
      Store.save();
    }
    return Store.data.srs[id];
  },
  get(id){ return Store.data.srs[id]; },
  record(id, kind, correct){
    const item = this.ensure(id, kind);
    item.lastReviewed = Date.now();
    if(correct){
      item.correct += 1;
      item.box = Math.min(item.box + 1, LEITNER_DAYS.length - 1);
      item.due = Date.now() + LEITNER_DAYS[item.box] * 86400000;
    } else {
      item.incorrect += 1;
      item.box = 0;
      item.due = Date.now(); // due again immediately (and re-queued this session)
    }
    Store.save();
    return item;
  },
  dueIds(kindFilter){
    const now = Date.now();
    return Object.keys(Store.data.srs).filter(id=>{
      const it = Store.data.srs[id];
      if(kindFilter && it.kind !== kindFilter) return false;
      return it.due <= now;
    });
  },
  allIntroducedIds(kindFilter){
    return Object.keys(Store.data.srs).filter(id => !kindFilter || Store.data.srs[id].kind === kindFilter);
  },
  masteryLabel(item){
    if(!item) return "new";
    if(item.box <= 1) return "learning";
    if(item.box <= 3) return "familiar";
    return "mastered";
  },
  strugglingIds(kindFilter, minWrong){
    minWrong = minWrong || 2;
    return Object.keys(Store.data.srs).filter(id=>{
      const it = Store.data.srs[id];
      if(kindFilter && it.kind !== kindFilter) return false;
      return it.incorrect >= minWrong && it.incorrect >= it.correct;
    });
  }
};

/* =========================================================================
   CONFUSION TRACKING — recognizes patterns like В/Б, Ы/И, Е/Э, Я/Ю
   ========================================================================= */
const Confusion = {
  key(a,b){ return [a,b].sort().join("|"); },
  log(a,b){
    if(a===b) return;
    const k = this.key(a,b);
    Store.data.confusion[k] = (Store.data.confusion[k]||0) + 1;
    Store.save();
  },
  top(n){
    return Object.entries(Store.data.confusion)
      .sort((a,b)=>b[1]-a[1])
      .slice(0, n||5)
      .map(([k,v])=>({pair:k.split("|"), count:v}));
  }
};

/* =========================================================================
   SPEECH — Web Speech API wrapper (graceful no-op if unsupported)
   ========================================================================= */
const Speech = {
  available: typeof window!=="undefined" && "speechSynthesis" in window,
  voices: [],
  ruVoice: null,
  init(){
    if(!this.available) return;
    const load = ()=>{
      this.voices = window.speechSynthesis.getVoices() || [];
      this.ruVoice = this.voices.find(v=>/^ru/i.test(v.lang)) || null;
    };
    load();
    if(typeof window.speechSynthesis.onvoiceschanged !== "undefined"){
      window.speechSynthesis.onvoiceschanged = load;
    }
  },
  speak(text, rate){
    if(!this.available || !text) return false;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ru-RU";
      u.rate = rate || 0.95;
      if(this.ruVoice) u.voice = this.ruVoice;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }
};
function speakBtn(text, rate, extraClass){
  if(!Speech.available) return "";
  const safe = escapeHtml(text).replace(/"/g,"&quot;");
  return `<button type="button" class="speak-btn ${extraClass||""}" onclick="event.stopPropagation();Speech.speak('${text.replace(/'/g,"\\'")}', ${rate||1})" title="Listen" aria-label="Listen">🔊</button>`;
}
/* =========================================================================
   EXERCISE GENERATORS
   Every generator returns a plain exercise object consumed by ExercisePlayer:
   { type, kicker, promptRu, promptEn, sub, audio, options, accept,
     correctDisplay, pairs, orderTokens, itemRef, explain }
   ========================================================================= */
const LETTER_SOUND_KEY = {
  "А":"AH","О":"O","М":"M","Т":"T","К":"K",
  "Н":"N","В":"V","Р":"R","С":"S","У":"OO",
  "Э":"EH","Х":"KH","З":"Z","И":"EE","П":"P",
  "Л":"L","Г":"G","Д":"D","Б":"B","Ж":"ZH",
  "Е":"YE","Ё":"YO","Й":"Y","Ы":"UH","Ь":"(softens)",
  "Ю":"YU","Я":"YA","Ц":"TS","Ч":"CH","Ш":"SH",
  "Щ":"SHCH","Ъ":"(silent)","Ф":"F"
};
const CONFUSABLE_LETTERS = [["В","Б"],["Ы","И"],["Е","Э"],["Я","Ю"],["Ш","Щ"],["Н","П"],["Р","Ь"],["Г","П"],["З","Э"],["Ц","Ч"],["Ч","Щ"]];

function pickDistractorLetters(letter, pool, count){
  pool = pool.filter(l=>l.up!==letter.up);
  const forced = [];
  CONFUSABLE_LETTERS.forEach(pair=>{
    if(pair.includes(letter.up)){
      const other = pair[0]===letter.up ? pair[1] : pair[0];
      const found = pool.find(l=>l.up===other);
      if(found && !forced.includes(found)) forced.push(found);
    }
  });
  const rest = sample(pool.filter(l=>!forced.includes(l)), Math.max(0,count-forced.length));
  return sample(forced.concat(rest), Math.min(count, forced.length+rest.length));
}

function genLetterSoundMC(letter, pool){
  const distractors = pickDistractorLetters(letter, pool, 3);
  const options = shuffle([letter, ...distractors]).map(l=>({text:LETTER_SOUND_KEY[l.up]||l.nameTr, correct:l.up===letter.up, refId:l.up}));
  return {
    type:"mc", kicker:"Cyrillic → Sound",
    promptRu: letter.up, sub:null,
    options,
    itemRef:{id:letter.id, kind:"letter"},
    explain:`“${letter.up}” sounds like: ${letter.sound} Example: ${letter.ex} (${letter.exTr}) = “${letter.exEn}”.`,
    correctDisplay: LETTER_SOUND_KEY[letter.up]||letter.nameTr
  };
}
function genLetterFromSoundMC(letter, pool){
  const distractors = pickDistractorLetters(letter, pool, 3);
  const options = shuffle([letter, ...distractors]).map(l=>({text:l.up, correct:l.up===letter.up, refId:l.up}));
  return {
    type:"mc", kicker:"Sound → Cyrillic",
    promptEn: LETTER_SOUND_KEY[letter.up]||letter.nameTr, sub:"Which letter makes this sound?",
    options,
    itemRef:{id:letter.id, kind:"letter"},
    explain:`“${letter.up}” sounds like: ${letter.sound}`,
    correctDisplay: letter.up
  };
}
function genWordReadingMC(word, pool){
  const others = sample(pool.filter(w=>w.ru!==word.ru), 3).map(w=>w.tr);
  const options = shuffle([word.tr, ...others]).map(t=>({text:t, correct:t===word.tr}));
  return {
    type:"mc", kicker:"Reading Practice",
    promptRu: word.ru, sub:"How is this pronounced?",
    options,
    itemRef:null,
    explain: word.en ? `“${word.ru}” (${word.tr}) means “${word.en}”.` : `“${word.ru}” is pronounced “${word.tr}”.`,
    correctDisplay: word.tr
  };
}
function genWordReadingType(word){
  return {
    type:"type", kicker:"Reading Practice — Type What You Read",
    promptRu: word.ru, sub:"Type the pronunciation (English letters).",
    accept: word.tr.replace(/[-’]/g,""),

    correctDisplay: word.tr,

  };
}
function genVocabMC(item, direction, pool){
  pool = pool.filter(v=>v.id!==item.id);
  if(direction==="ru2en"){
    const correctEn = item.en.split("/")[0].trim();
    const distractors = sample(pool, 3).map(v=>v.en.split("/")[0].trim());
    const options = shuffle([correctEn, ...distractors]).map(t=>({text:t, correct:t===correctEn}));
    return {
      type:"mc", kicker:"Russian → English",
      promptRu:item.ru, sub:null, options,
      itemRef:{id:item.id, kind:"vocab"},
      explain:`“${item.ru}” (${item.tr}) means “${item.en}”.`,
      correctDisplay:item.en
    };
  } else {
    const promptEn = item.en.split("/")[0].trim();
    const distractors = sample(pool, 3).map(v=>v.ru);
    const options = shuffle([item.ru, ...distractors]).map(t=>({text:t, correct:t===item.ru}));
    return {
      type:"mc", kicker:"English → Russian",
      promptEn, sub:null, options,
      itemRef:{id:item.id, kind:"vocab"},
      explain:`“${promptEn}” = “${item.ru}” (${item.tr}).`,
      correctDisplay:item.ru
    };
  }
}
function genVocabType(item, direction){

function genSentenceOrder(sentence){

function genSentenceTranslate(sentence, direction){

function genGrammarExercise(topic, q){

/* =========================================================================
   EXERCISE PLAYER — generic runner for mc / type / match / order exercises
   ========================================================================= */
const ExercisePlayer = {
  queue:[], index:0, correctCount:0, results:[], onComplete:null, title:"",
  answered:false, allowClose:true, requeueWrong:false, extraAttempts:{},
  matchState:null, orderState:null,

  start(list, opts){
    opts = opts || {};
    this.queue = list.slice();
    this.index = 0;
    this.correctCount = 0;
    this.results = [];
    this.onComplete = opts.onComplete || function(){};
    this.title = opts.title || "Practice";
    this.allowClose = opts.allowClose !== false;
    this.requeueWrong = !!opts.requeueWrong;
    this.extraAttempts = {};
    Router.show("exercise");
    this.answered = false;
    this.render(); // render() itself calls finish() if the queue is empty
  },
  currentEx(){ return this.queue[this.index]; },
  close(){ Router.back(); },
  render(){
    const ex = this.currentEx();
    if(!ex){ this.finish(); return; }
    this.answered = false;
    const root = document.getElementById("view-exercise");
    const pct = Math.round((this.index/this.queue.length)*100);
    let body = "";
    if(ex.type==="mc") body = this._renderMC(ex);
    else if(ex.type==="type") body = this._renderType(ex);
    else if(ex.type==="match") body = this._renderMatch(ex);
    else if(ex.type==="order") body = this._renderOrder(ex);
    root.innerHTML = `
      <div id="exercise-wrap">
        <div class="ex-progress">
          ${this.allowClose ? `<span class="ex-close" onclick="ExercisePlayer.close()">✕</span>` : ""}
          <div class="progress-bar"><div style="width:${pct}%"></div></div>
          <span class="count">${this.index+1} / ${this.queue.length}</span>
        </div>
        ${body}
        <div id="ex-feedback"></div>
      </div>`;
    if(ex.audio){
      setTimeout(()=>Speech.speak(ex.audio.text, ex.audio.rate), 250);
    }
  },
  _kicker(ex){ return `<div class="ex-kicker">${escapeHtml(ex.kicker||"")}</div>`; },
  _promptBlock(ex){
    let html = this._kicker(ex);
    if(ex.audio){
      html += `<div style="margin:14px 0;">
        <button type="button" class="btn primary" style="font-size:1.3rem;padding:16px 28px;border-radius:50%;" onclick="Speech.speak('${ex.audio.text.replace(/'/g,"\\'")}', ${ex.audio.rate})" aria-label="Play audio">🔊</button>
      </div>`;
      if(ex.promptRu) html += `<div class="ex-prompt ru">${escapeHtml(ex.promptRu)}</div>`;
    } else if(ex.promptRu){
      html += `<div class="ex-prompt ru">${escapeHtml(ex.promptRu)}${speakBtn(ex.promptRu,0.85,"")}</div>`;
    } else if(ex.promptEn){
      html += `<div class="ex-prompt-en">${escapeHtml(ex.promptEn)}</div>`;
    }
    if(ex.sub) html += `<div class="ex-sub">${escapeHtml(ex.sub)}</div>`;
    return html;
  },
  _renderMC(ex){
    let html = `<div class="ex-card">${this._promptBlock(ex)}<div class="ex-options">`;
    ex.options.forEach((opt,i)=>{
      html += `<button type="button" class="opt-btn" data-i="${i}" onclick="ExercisePlayer.chooseMC(${i})">${escapeHtml(opt.text)}</button>`;
    });
    html += `</div></div>`;
    return html;
  },
  _renderType(ex){
    return `<div class="ex-card">${this._promptBlock(ex)}
      <div class="ex-input-row">
        <input type="text" class="ex-text-input" id="type-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer…">
        <button type="button" class="btn primary" onclick="ExercisePlayer.submitType()">Check</button>
      </div>
    </div>`;
  },
  _renderMatch(ex){
    const lefts = ex.pairs.map((p,i)=>({text:p[0], i}));
    const rights = shuffle(ex.pairs.map((p,i)=>({text:p[1], i})));
    this.matchState = {selectedLeft:null, matched:[], mistakes:0, lefts, rights};
    let html = `<div class="ex-card">${this._promptBlock(ex)}<div class="match-cols" id="match-cols">`;
    lefts.forEach((l,idx)=>{ html += `<div class="match-item left" data-side="l" data-idx="${idx}" onclick="ExercisePlayer.matchClick('l',${idx})">${escapeHtml(l.text)}</div>`; });
    rights.forEach((r,idx)=>{ html += `<div class="match-item right" data-side="r" data-idx="${idx}" onclick="ExercisePlayer.matchClick('r',${idx})">${escapeHtml(r.text)}</div>`; });
    html += `</div></div>`;
    return html;
  },
  _renderOrder(ex){
    const tokens = ex.orderTokens.map((t,i)=>({text:t, i}));
    this.orderState = {pool: shuffle(tokens), placed: []};
    let html = `<div class="ex-card">${this._promptBlock(ex)}
      <div class="order-tokens" id="order-slot"></div>
      <div class="order-pool" id="order-pool"></div>
      <div style="margin-top:12px;"><button type="button" class="btn sm ghost" onclick="ExercisePlayer.clearOrder()">Clear</button>
      <button type="button" class="btn sm primary" onclick="ExercisePlayer.submitOrder()">Check</button></div>
    </div>`;
    setTimeout(()=>this._paintOrder(), 0);
    return html;
  },
  _paintOrder(){
    const slot = document.getElementById("order-slot");
    const pool = document.getElementById("order-pool");
    if(!slot||!pool) return;
    slot.innerHTML = this.orderState.placed.map(t=>`<span class="token-btn" onclick="ExercisePlayer.unplaceOrder(${t.i})">${escapeHtml(t.text)}</span>`).join("") || `<span class="muted" style="align-self:center;">Tap words below…</span>`;
    pool.innerHTML = this.orderState.pool.map(t=>`<button type="button" class="token-btn" onclick="ExercisePlayer.placeOrder(${t.i})">${escapeHtml(t.text)}</button>`).join("");
  },
  placeOrder(i){
    const idx = this.orderState.pool.findIndex(t=>t.i===i);
    if(idx===-1) return;
    const [tok] = this.orderState.pool.splice(idx,1);
    this.orderState.placed.push(tok);
    this._paintOrder();
  },
  unplaceOrder(i){
    if(this.answered) return;
    const idx = this.orderState.placed.findIndex(t=>t.i===i);
    if(idx===-1) return;
    const [tok] = this.orderState.placed.splice(idx,1);
    this.orderState.pool.push(tok);
    this._paintOrder();
  },
  clearOrder(){
    if(this.answered) return;
    this.orderState.pool = this.orderState.pool.concat(this.orderState.placed);
    this.orderState.placed = [];
    this._paintOrder();
  },
  submitOrder(){
    if(this.answered) return;
    const ex = this.currentEx();
    const given = this.orderState.placed.map(t=>t.text).join(" ");
    const correct = given === ex.orderTokens.join(" ");
    this.answered = true;
    document.querySelectorAll("#order-pool .token-btn").forEach(b=>b.disabled=true);
    this._afterAnswer(ex, correct, {given});
  },
  matchClick(side, idx){
    if(this.answered) return;
    const st = this.matchState;
    const el = document.querySelector(`.match-item[data-side="${side}"][data-idx="${idx}"]`);
    if(!el || el.classList.contains("matched")) return;
    if(side==="l"){
      document.querySelectorAll('.match-item.left').forEach(e=>e.classList.remove("selected"));
      st.selectedLeft = idx; el.classList.add("selected");
      return;
    }
    if(st.selectedLeft===null) return;
    const leftIdx = st.selectedLeft;
    const leftEl = document.querySelector(`.match-item[data-side="l"][data-idx="${leftIdx}"]`);
    const isMatch = st.lefts[leftIdx].i === st.rights[idx].i;
    if(isMatch){
      leftEl.classList.remove("selected"); leftEl.classList.add("matched");
      el.classList.add("matched");
      st.matched.push(leftIdx);
      st.selectedLeft = null;
      if(st.matched.length === st.lefts.length){
        this.answered = true;
        const ex = this.currentEx();
        this._afterAnswer(ex, st.mistakes===0, {mistakes:st.mistakes});
      }
    } else {
      st.mistakes++;
      el.classList.add("mismatch");
      setTimeout(()=>{ el.classList.remove("mismatch"); leftEl.classList.remove("selected"); }, 450);
      st.selectedLeft = null;
    }
  },
  chooseMC(i){
    if(this.answered) return;
    this.answered = true;
    const ex = this.currentEx();
    const opt = ex.options[i];
    document.querySelectorAll(".opt-btn").forEach((b,bi)=>{
      b.disabled = true;
      if(ex.options[bi].correct) b.classList.add("correct");
      else if(bi===i) b.classList.add("wrong");
    });
    this._afterAnswer(ex, !!opt.correct, {chosenOpt:opt});
  },
  submitType(){
    if(this.answered) return;
    const input = document.getElementById("type-input");
    const given = input.value;
    const ex = this.currentEx();
    const correct = ex.lenient ? answerMatches(given, ex.accept.split("/")[0]) || answerMatches(given, ex.accept) : answerMatches(given, ex.accept);
    this.answered = true;
    input.disabled = true;
    input.classList.add(correct?"correct":"wrong");
    this._afterAnswer(ex, correct, {given});
  },
  _afterAnswer(ex, correct, extra){
    Store.data.totalAnswered++;
    if(correct) Store.data.totalCorrect++;
    if(ex.itemRef){
      SRS.record(ex.itemRef.id, ex.itemRef.kind, correct);
      if(!correct && ex.itemRef.kind==="vocab"){
        Store.data.vocabMistakes[ex.itemRef.id] = (Store.data.vocabMistakes[ex.itemRef.id]||0)+1;
      }
    }
    if(!correct && ex.type==="mc" && extra && extra.chosenOpt && extra.chosenOpt.refId){
      const correctOpt = ex.options.find(o=>o.correct);
      if(correctOpt && correctOpt.refId) Confusion.log(correctOpt.refId, extra.chosenOpt.refId);
    }
    if(correct){ this.correctCount++; Store.addXp(2); } else { Store.save(); }
    this.results.push({itemRef:ex.itemRef, correct});
    if(!correct && this.requeueWrong){
      const key = ex.itemRef ? ex.itemRef.id : Math.random();
      this.extraAttempts[key] = (this.extraAttempts[key]||0)+1;
      if(this.extraAttempts[key] <= 2) this.queue.push(ex);
    }
    this._showFeedback(ex, correct);
  },
  _showFeedback(ex, correct){
    const fb = document.getElementById("ex-feedback");
    const encourage = ["Nice work!","You've got it.","Great — that's sticking.","Solid.","Exactly right."];
    let html = `<div class="feedback-box ${correct?"correct":"wrong"}">
      <div class="feedback-title">${correct? pick(encourage) : "Not quite!"}</div>`;
    if(!correct){
      html += `<div class="feedback-answer ru">${escapeHtml(ex.correctDisplay||"")}</div>`;
    }
    if(ex.explain) html += `<div class="feedback-explain">${escapeHtml(ex.explain)}</div>`;
    html += `</div><div class="ex-footer"><button type="button" class="btn primary" onclick="ExercisePlayer.next()">Continue</button></div>`;
    fb.innerHTML = html;
    fb.scrollIntoView({behavior:"smooth", block:"nearest"});
  },
  next(){
    this.index++;
    this.render();
  },
  finish(){
    const total = this.results.length;
    const summary = {correctCount:this.correctCount, total, results:this.results};
    const cb = this.onComplete;
    this.onComplete = null;
    cb(summary);
  }
};

function lessonHardSoft(){
  const qs = [
    {options:["я, ё, ю, и, е, ь","а, о, у, ы, э"], correct:0, prompt:"Which letters make the CONSONANT before them soft?"},
    {options:["мат (checkmate)","мать (mother)"], correct:1, prompt:"Which word ends in a SOFT “т”, spelled with a soft sign?"},
    {options:["Press your tongue toward the roof of your mouth","Round your lips forward"], correct:0, prompt:"How do you physically make a consonant “soft”?"},
    {options:["брат (brother) — hard р","ты (you) — hard т"], correct:0, prompt:"Both words have hard consonants here — pick the one where the hardness is easiest to hear before “а”."},
    {options:["It changes the meaning of the whole word","It's just a spelling rule with no effect on pronunciation"], correct:0, prompt:"Why does hard vs. soft actually matter? (Hint: мат vs. мать)"}
  ];
  return {
    id:"lvl1_hardsoft", level:1, icon:"🎛️", xp:20,
    title:"Hard & Soft Consonants", subtitle:"A key Russian sound pattern",
    teach(){
      return [
        {html:`<h3>Hard & Soft Consonants</h3>
          <p class="grammar-block">Russian consonants come in two versions: <b>hard</b> and <b>soft</b>. A soft consonant is pronounced with your tongue pressed up toward the roof of your mouth — it sounds a little like a fast, light “y” is squeezed in right after the consonant.</p>
          <p class="grammar-block">You don't need to memorize a rule for this — you can just look at the very next letter:</p>
          <div class="compare-box">
            <div class="half"><div class="k">Hard</div>Followed by а, о, у, ы, э (or nothing)</div>
            <div class="half"><div class="k">Soft</div>Followed by я, ё, ю, и, е — or by <b>ь</b> (the soft sign)</div>
          </div>`},
        {html:`<h3>Hear the difference</h3>
          <div class="example-line"><span class="ru">мат</span> ${speakBtn("мат",0.8)}<div class="tr">mat (hard т)</div><div class="en">= checkmate</div></div>
          <div class="example-line"><span class="ru">мать</span> ${speakBtn("мать",0.8)}<div class="tr">mat’ (soft т)</div><div class="en">= mother</div></div>
          <p class="grammar-block">Same letters, one tiny soft sign — completely different word! This is why the soft sign (ь) matters so much, even though it makes no sound on its own.</p>`},
        {html:`<h3>More examples</h3>
          <div class="example-line"><span class="ru">брат</span> ${speakBtn("брат",0.8)}<div class="tr">brat</div><div class="en">brother — hard р</div></div>
          <div class="example-line"><span class="ru">ряд</span> ${speakBtn("ряд",0.8)}<div class="tr">ryat</div><div class="en">row — soft р (from я)</div></div>
          <p class="grammar-block">As you learn more words, keep an ear out for this — it's one of the things that makes Russian sound distinctly Russian.</p>`}
      ];
    },
    buildQuiz(){
      return qs.map((q,i)=>({
        type:"mc", kicker:"Hard & Soft Consonants",
        promptEn:q.prompt, sub:null,
        options:q.options.map((t,oi)=>({text:t, correct:oi===q.correct})),
        itemRef:null,
        explain:"Soft consonants (before я/ё/ю/и/е or ь) are pronounced with the tongue raised toward the palate — it's what gives Russian its distinctive sound.",
        correctDisplay:q.options[q.correct]
      }));
    }
  };
}

function isLessonUnlocked(lesson){
  if(lesson.order===0) return true;
  const prev = LESSONS[lesson.order-1];
  const prog = Store.data.lessonProgress[prev.id];
  return !!(prog && prog.completed);
}
function isLessonCompleted(lesson){
  const prog = Store.data.lessonProgress[lesson.id];
  return !!(prog && prog.completed);
}
function nextLesson(){
  return LESSONS.find(l=>!isLessonCompleted(l) && isLessonUnlocked(l)) || LESSONS[LESSONS.length-1];
}
function isLevelComplete(lvl){
  return lessonsForLevel(lvl).every(isLessonCompleted);
}
function currentLevelNum(){
  for(let lvl=1; lvl<=15; lvl++){
    if(!isLevelComplete(lvl)) return lvl;
  }
  return 15;
}

  start(lesson){
    this.lesson = lesson;
    this.cards = lesson.teach();
    this.cardIndex = 0;
    Router.show("lesson");
    this.renderTeach();
  },
  renderTeach(){
    const root = document.getElementById("view-lesson");
    const card = this.cards[this.cardIndex];
    const dots = this.cards.map((_,i)=>`<span class="${i===this.cardIndex?"active":""}"></span>`).join("");
    root.innerHTML = `
      <div class="teach-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div class="pill">${escapeHtml(LEVEL_META[this.lesson.level].title)}</div>
          <span class="ex-close" onclick="Router.show('learn')">✕</span>
        </div>
        <div style="margin-top:10px;">${card.html}</div>
        <div class="teach-nav">
          <button type="button" class="btn ghost" onclick="LessonPlayer.prevCard()" ${this.cardIndex===0?"disabled":""}>Back</button>
          <div class="teach-dots">${dots}</div>
          <button type="button" class="btn primary" onclick="LessonPlayer.nextCard()">${this.cardIndex===this.cards.length-1?"Start Quiz →":"Next"}</button>
        </div>
      </div>`;
  },
  prevCard(){ if(this.cardIndex>0){ this.cardIndex--; this.renderTeach(); } },
  nextCard(){
    if(this.cardIndex < this.cards.length-1){ this.cardIndex++; this.renderTeach(); }
    else this.startQuiz();
  },
  startQuiz(){
    const quiz = this.lesson.buildQuiz();
    ExercisePlayer.start(quiz, {
      title:this.lesson.title, allowClose:true, requeueWrong:false,
      onComplete:(summary)=>this.onQuizDone(summary)
    });
  },
  onQuizDone(summary){
    const pct = summary.total ? Math.round(summary.correctCount/summary.total*100) : 100;
    const pass = pct >= 70;
    const prog = Store.data.lessonProgress[this.lesson.id] || {completed:false,bestScore:0,attempts:0};
    prog.attempts = (prog.attempts||0) + 1;
    prog.bestScore = Math.max(prog.bestScore||0, pct);
    const firstTimePass = pass && !prog.completed;
    if(pass) prog.completed = true;
    Store.data.lessonProgress[this.lesson.id] = prog;
    if(firstTimePass) Store.addXp(this.lesson.xp||20);
    Store.save();
    Router.show("lesson");
    this.renderResults(pct, pass, firstTimePass);
  },
  renderResults(pct, pass, firstTimePass){
    const root = document.getElementById("view-lesson");
    root.innerHTML = `
      <div class="teach-card" style="text-align:center;">
        <div style="font-size:3rem;">${pass?"🎉":"💡"}</div>
        <h2>${pass?"Lesson Complete!":"Almost There"}</h2>
        <p class="muted">Score: ${pct}% ${pass?"— nice, that's a pass (70%+)":"— you need 70% to pass"}</p>
        <div class="progress-bar" style="margin:16px 0;"><div style="width:${pct}%"></div></div>
        ${firstTimePass?`<p class="pill done">+${this.lesson.xp||20} XP earned</p>`:""}
        ${!pass?`<p class="grammar-block">No worries — that's exactly what review is for. Go back through the lesson content, then try again.</p>`:""}
        <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
          <button type="button" class="btn ghost" onclick="Router.show('learn')">Back to Lessons</button>
          ${pass?`<button type="button" class="btn primary" onclick="Router.show('learn')">Continue</button>`
                :`<button type="button" class="btn primary" onclick="LessonPlayer.start(LessonPlayer.lesson)">Try Again</button>`}
        </div>
      </div>`;
  }
};

const Router = {
  current:"dashboard",
  returnTo:"dashboard",
  show(view){
    const isOverlay = (view==="lesson"||view==="exercise");
    if(!isOverlay) this.returnTo = view;
    document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"));
    const el = document.getElementById("view-"+view);
    if(!el) return;
    el.classList.remove("hidden");
    this.current = view;
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.nav===view));
    window.scrollTo(0,0);
    const renderers = {
      dashboard:renderDashboard, learn:renderLearn, practice:renderPractice,
      review:renderReview, listening:renderListening, vocab:renderVocab,
      grammar:renderGrammar, conversation:renderConversation, progress:renderProgress
    };
    if(renderers[view]) renderers[view]();
    Store.save();
  },
  back(){ this.show(this.returnTo||"dashboard"); }
};

/* Helpers to map an SRS id back to its underlying data object */
function letterFromId(id){ return ALPHABET.find(l=>l.id===id); }
function vocabFromId(id){ return VOCAB.find(v=>v.id===id); }
function sentenceFromId(id){ return SENTENCES.find(s=>s.id===id); }
function genReviewExerciseForId(id, kind){
  try{
    if(kind==="letter"){ const l=letterFromId(id); if(!l) return null; return Math.random()<0.5?genLetterSoundMC(l,ALPHABET):genLetterFromSoundMC(l,ALPHABET); }
    if(kind==="vocab"){ const v=vocabFromId(id); if(!v) return null; return Math.random()<0.5?genVocabMC(v,Math.random()<0.5?"ru2en":"en2ru",VOCAB):genVocabType(v,Math.random()<0.5?"ru2en":"en2ru"); }
    if(kind==="sentence"){ const s=sentenceFromId(id); if(!s) return null; const r=Math.random(); return r<0.34?genSentenceOrder(s):r<0.67?genSentenceMatch(s):genSentenceTranslate(s,Math.random()<0.5?"ru2en":"en2ru"); }
    if(kind==="grammar"){
      const topic = GRAMMAR.find(g=>g.questions.some(q=>q.id===id));
      if(!topic) return null;
      const q = topic.questions.find(q=>q.id===id);
      return genGrammarExercise(topic,q);
    }
  }catch(e){ return null; }
  return null;
}

function sessionPool(kindPool, minCount){
  return kindPool.length >= minCount ? kindPool : null;
}
function practiceMixed(){
  const letters = introducedLetters(), vocab = introducedVocab(), sentences = introducedSentences();
  if(letters.length+vocab.length+sentences.length < 4){ toast("Complete a few lessons first to build up your practice pool."); return; }
  let exs = [];
  sample(letters, Math.min(4,letters.length)).forEach(l=>exs.push(Math.random()<0.5?genLetterSoundMC(l,ALPHABET):genLetterFromSoundMC(l,ALPHABET)));
  sample(vocab, Math.min(8,vocab.length)).forEach(v=>exs.push(genVocabMC(v,Math.random()<0.5?"ru2en":"en2ru",VOCAB)));
  sample(sentences, Math.min(4,sentences.length)).forEach(s=>exs.push(genSentenceTranslate(s,Math.random()<0.5?"ru2en":"en2ru")));
  ExercisePlayer.start(shuffle(exs), {title:"Mixed Practice", requeueWrong:true, onComplete:s=>showSessionResults(s,"practice")});
}

  const vocab = introducedVocab();
  const pool = vocab.length>=6 ? vocab : READING_WORDS;
  let exs = sample(pool, Math.min(12,pool.length)).map(w=> Math.random()<0.7?genWordReadingMC(w,pool):genWordReadingType(w));

  sample(items,Math.min(4,items.length)).forEach(v=>exs.push(genVocabType(v,Math.random()<0.5?"ru2en":"en2ru")));

function practiceGrammarTopic(topicId, force){

function startTargetedPractice(){
  const confusions = Confusion.top(6);
  const strugglingVocab = SRS.strugglingIds("vocab",2).map(vocabFromId).filter(Boolean);
  let exs = [];
  confusions.forEach(c=>{
    const l1 = ALPHABET.find(l=>l.up===c.pair[0]), l2 = ALPHABET.find(l=>l.up===c.pair[1]);
    if(l1) exs.push(genLetterSoundMC(l1, ALPHABET)); if(l1) exs.push(genLetterFromSoundMC(l1, ALPHABET));
    if(l2) exs.push(genLetterSoundMC(l2, ALPHABET)); if(l2) exs.push(genLetterFromSoundMC(l2, ALPHABET));
  });
  strugglingVocab.forEach(v=>{
    exs.push(genVocabMC(v,"ru2en",VOCAB)); exs.push(genVocabType(v,"ru2en"));
  });
  if(!exs.length){ toast("Nothing to target yet — keep practicing!"); return; }
  ExercisePlayer.start(shuffle(exs), {title:"Targeted Practice", requeueWrong:true, onComplete:s=>showSessionResults(s,"review")});

function startListening(tierNum){
  const tier = LISTENING_TIERS[tierNum-1];

  const chosen = sample(pool, Math.min(10,pool.length));

    const learned = items.filter(v=>SRS.get(v.id)).length;
    const open = VocabView.openCat === cat.key;
    html += `<div class="card">
      <div class="card-row" style="justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleVocabCat('${cat.key}')">
        <h3>${cat.icon} ${escapeHtml(cat.title)}</h3>
        <span class="pill ${learned===items.length&&items.length?"done":""}">${learned}/${items.length} learned</span>
      </div>
      ${open ? items.map(v=>{
        const mastery = SRS.get(v.id) ? SRS.masteryLabel(SRS.get(v.id)) : "not started";
        return `<div class="vocab-card">
          <div>
            <div class="vocab-ru">${escapeHtml(v.ru)}</div>
            <div class="vocab-tr">${escapeHtml(v.tr)}</div>
            <div class="vocab-en">${escapeHtml(v.en)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="pill ${mastery==="mastered"?"done":mastery==="not started"?"locked":"warn"}">${mastery}</span>
            ${speakBtn(v.ru,0.85)}
          </div>
        </div>`;
      }).join("") + `<button type="button" class="btn sm" style="margin-top:10px;" onclick="event.stopPropagation();practiceVocabCategory('${cat.key}')">Practice this category</button>`
      : ""}
    </div>`;
  });
  root.innerHTML = html;
}
function toggleVocabCat(key){
  VocabView.openCat = VocabView.openCat===key ? null : key;
  renderVocab();
}

/* =========================================================================
   VIEW — GRAMMAR BROWSER
   ========================================================================= */
const GrammarView = { openTopic:null };
function renderGrammar(){
  const root = document.getElementById("view-grammar");
  if(GrammarView.openTopic){
    const topic = grammarById(GrammarView.openTopic);
    root.innerHTML = `
      <div class="teach-card">
        <span class="ex-close" onclick="GrammarView.openTopic=null;renderGrammar();">✕ Back</span>
        <h2 style="margin-top:10px;">${escapeHtml(topic.title)}</h2>
        ${topic.explain.map(p=>`<p class="grammar-block">${escapeHtml(p)}</p>`).join("")}
        <h3>Examples</h3>
        ${topic.examples.map(e=>`
          <div class="example-line">
            <span class="ru">${escapeHtml(e.ru)}</span> ${e.tr?speakBtn(e.ru,0.85):""}
            ${e.tr?`<div class="tr">${escapeHtml(e.tr)}</div>`:""}
            <div class="en">${escapeHtml(e.en)}</div>
          </div>`).join("")}
        <button type="button" class="btn primary block" style="margin-top:16px;" onclick="practiceGrammarTopic('${topic.id}', true)">Practice This Topic</button>
      </div>`;
    return;
  }
  let html = `<h2 style="margin-bottom:4px;">Grammar</h2><p class="muted" style="margin-bottom:18px;">Explained through examples, not jargon. Tap a topic to read it.</p>`;
  LEVEL_META.forEach((meta,lvl)=>{
    const topics = GRAMMAR.filter(g=>g.level===lvl);
    if(!topics.length) return;
    html += `<div class="section-title">Level ${lvl} · ${escapeHtml(meta.title)}</div>`;
    topics.forEach(g=>{
      const done = g.questions.every(q=>{ const it=SRS.get(q.id); return it && it.box>=2; });
      html += `<div class="lesson-item" onclick="GrammarView.openTopic='${g.id}';renderGrammar();">
        <div class="li-ico">🧩</div>
        <div class="li-body">
          <div class="li-title">${escapeHtml(g.title)}</div>
          <div class="li-sub">${escapeHtml(g.explain[0].slice(0,90))}${g.explain[0].length>90?"…":""}</div>
        </div>
        ${done?`<span class="check-badge">✅</span>`:""}
      </div>`;
    });
  });
  root.innerHTML = html;
}

/* =========================================================================
   VIEW — CONVERSATION SIMULATOR
   ========================================================================= */
function renderConversation(){
  ConversationPlayer.conv = null;
  const root = document.getElementById("view-conversation");
  let html = `<h2 style="margin-bottom:4px;">Conversation</h2><p class="muted" style="margin-bottom:18px;">Read (and hear) the other side, then pick the reply a Russian speaker would actually give.</p>`;
  CONVERSATIONS.forEach(c=>{
    const done = Store.data.conversationProgress[c.id] && Store.data.conversationProgress[c.id].done;
    const difficulty = c.level<=5?"Beginner":c.level<=10?"Intermediate":"Advanced";
    html += `<div class="lesson-item" onclick="ConversationPlayer.start('${c.id}')">
      <div class="li-ico">${done?"✅":"💬"}</div>
      <div class="li-body">
        <div class="li-title">${escapeHtml(c.title)}</div>
        <div class="li-sub">${escapeHtml(c.desc)}</div>
      </div>
      <span class="pill">${difficulty}</span>
    </div>`;
  });
  root.innerHTML = html;
}
const ConversationPlayer = {
  conv:null, turnIndex:0, log:[], answered:false,
  start(convId){
    Router.show("conversation");
    this.conv = CONVERSATIONS.find(c=>c.id===convId);
    this.turnIndex = 0; this.log = []; this.answered = false;
    this.log.push({side:"bot", ru:this.conv.turns[0].bot, tr:this.conv.turns[0].botTr, en:this.conv.turns[0].botEn});
    this.paint();
    setTimeout(()=>Speech.speak(this.conv.turns[0].bot, 0.92), 300);
  },
  exit(){ Router.show("conversation"); },
  paint(){
    const root = document.getElementById("view-conversation");
    const turn = this.conv.turns[this.turnIndex];
    let chatHtml = this.log.map(m=>{
      if(m.side==="bot"){
        return `<div class="chat-bubble bot ru">${escapeHtml(m.ru)}${speakBtn(m.ru,0.9)}<span class="tr">${escapeHtml(m.tr||"")} — ${escapeHtml(m.en||"")}</span></div>`;
      }
      return `<div class="chat-bubble user ru" style="align-self:flex-end;">${escapeHtml(m.ru)}<span class="tr">${escapeHtml(m.en||"")}</span></div>`;
    }).join("");

    let bottom = "";
    if(!this.answered){
      const opts = turn.replies.map((r,i)=>({...r, i}));
      const shuffled = shuffle(opts);
      bottom = `<div class="ex-options">` + shuffled.map(r=>`<button type="button" class="opt-btn" onclick="ConversationPlayer.choose(${r.i})">${escapeHtml(r.ru)}</button>`).join("") + `</div>`;
    } else {
      const last = this.lastResult;
      bottom = `<div class="feedback-box ${last.correct?"correct":"wrong"}">
        <div class="feedback-title">${last.correct?"Nice — natural reply!":"Not quite the natural reply"}</div>
        ${!last.correct?`<div class="feedback-answer ru">${escapeHtml(last.correctReply.ru)}</div>`:""}
        <div class="feedback-explain">${escapeHtml(last.explain)}</div>
      </div>
      <div class="ex-footer"><button type="button" class="btn primary" onclick="ConversationPlayer.advance()">${this.turnIndex<this.conv.turns.length-1?"Continue":"Finish"}</button></div>`;
    }
    root.innerHTML = `
      <div id="exercise-wrap">
        <div class="ex-progress"><span class="ex-close" onclick="ConversationPlayer.exit()">✕</span>
          <div class="progress-bar"><div style="width:${Math.round((this.turnIndex)/this.conv.turns.length*100)}%"></div></div>
          <span class="count">${this.turnIndex+1} / ${this.conv.turns.length}</span>
        </div>
        <div class="chat-log">${chatHtml}</div>
        ${bottom}
      </div>`;
  },
  choose(i){
    if(this.answered) return;
    this.answered = true;
    const turn = this.conv.turns[this.turnIndex];
    const chosen = turn.replies[i];
    const correctReply = turn.replies.find(r=>r.correct);
    Store.data.totalAnswered++;
    if(chosen.correct){ Store.data.totalCorrect++; Store.addXp(3); }
    Store.save();
    this.log.push({side:"user", ru:correctReply.ru, en:correctReply.en});
    this.lastResult = {correct:chosen.correct, correctReply, explain:chosen.explain};
    this.paint();
  },
  advance(){
    if(this.turnIndex < this.conv.turns.length-1){
      this.turnIndex++;
      this.answered = false;
      const nextTurn = this.conv.turns[this.turnIndex];
      this.log.push({side:"bot", ru:nextTurn.bot, tr:nextTurn.botTr, en:nextTurn.botEn});
      this.paint();
      setTimeout(()=>Speech.speak(nextTurn.bot, 0.92), 300);
    } else {
      Store.data.conversationProgress[this.conv.id] = {done:true};
      Store.addXp(15);
      Store.save();
      const root = document.getElementById("view-conversation");
      root.innerHTML = `<div id="exercise-wrap"><div class="ex-card">
        <div style="font-size:2.5rem;">🎉</div>
        <h2>Conversation Complete</h2>
        <p class="muted">+15 XP</p>
        <button type="button" class="btn primary" onclick="Router.show('conversation')">Back to Conversations</button>
      </div></div>`;
    }
  }
};

/* =========================================================================
   VIEW — PROGRESS
   ========================================================================= */
function renderProgress(){
  const root = document.getElementById("view-progress");
  const srsEntries = Object.entries(Store.data.srs);
  const byKind = {letter:[], vocab:[], sentence:[], grammar:[]};
  srsEntries.forEach(([id,it])=>{ if(byKind[it.kind]) byKind[it.kind].push(it); });
  const masteryCounts = kind => {
    const arr = byKind[kind];
    return {
      learning: arr.filter(it=>it.box<=1).length,
      familiar: arr.filter(it=>it.box>=2&&it.box<=3).length,
      mastered: arr.filter(it=>it.box>=4).length,
      total: arr.length
    };
  };
  const confusions = Confusion.top(10);
  const strugglingVocab = SRS.strugglingIds("vocab",2).map(vocabFromId).filter(Boolean);
  const accuracy = Store.data.totalAnswered ? Math.round(Store.data.totalCorrect/Store.data.totalAnswered*100) : 0;

  function masteryBar(kind,label){
    const m = masteryCounts(kind);
    if(!m.total) return `<div class="muted" style="margin-bottom:10px;">${label}: nothing introduced yet.</div>`;
    return `<div style="margin-bottom:14px;">
      <div class="card-row" style="justify-content:space-between;"><b>${label}</b><span class="muted">${m.total} introduced</span></div>
      <div class="progress-bar" style="margin:6px 0;overflow:hidden;display:flex;">
        <div style="width:${m.learning/m.total*100}%;background:var(--error);"></div>
        <div style="width:${m.familiar/m.total*100}%;background:var(--warn);"></div>
        <div style="width:${m.mastered/m.total*100}%;background:var(--success);"></div>
      </div>
      <div class="muted" style="font-size:.78rem;">🔴 ${m.learning} learning · 🟡 ${m.familiar} familiar · 🟢 ${m.mastered} mastered</div>
    </div>`;
  }

  root.innerHTML = `
    <h2 style="margin-bottom:4px;">Progress</h2>
    <p class="muted" style="margin-bottom:18px;">Everything here lives only in this browser — no account, no server.</p>

    <div class="grid-3">
      <div class="stat-tile"><div class="num">${currentLevelNum()}</div><div class="lbl">Current Level</div></div>
      <div class="stat-tile"><div class="num">${Store.data.xp}</div><div class="lbl">Total XP</div></div>
      <div class="stat-tile"><div class="num">${accuracy}%</div><div class="lbl">Overall Accuracy</div></div>
      <div class="stat-tile"><div class="num">🔥${Store.data.streak}</div><div class="lbl">Day Streak</div></div>
      <div class="stat-tile"><div class="num">${LESSONS.filter(isLessonCompleted).length}/${LESSONS.length}</div><div class="lbl">Lessons Complete</div></div>
      <div class="stat-tile"><div class="num">${Store.data.totalAnswered}</div><div class="lbl">Questions Answered</div></div>
    </div>

    <div class="card">
      <h3>Mastery Breakdown</h3>
      ${masteryBar("letter","Letters")}
      ${masteryBar("vocab","Vocabulary")}
      ${masteryBar("sentence","Sentences")}
      ${masteryBar("grammar","Grammar")}
    </div>

    <div class="card">
      <h3>🎯 Things You're Struggling With</h3>
      ${confusions.length ? `<p class="muted">Letters you frequently mix up:</p>` + confusions.map(c=>`<div class="confusion-row"><span class="confusion-pair">${escapeHtml(c.pair[0])} vs ${escapeHtml(c.pair[1])}</span><span class="muted">${c.count} mix-up${c.count===1?"":"s"}</span></div>`).join("") : ""}
      ${strugglingVocab.length ? `<p class="muted" style="margin-top:10px;">Words that keep tripping you up:</p>` + strugglingVocab.map(v=>`<div class="confusion-row"><span class="vocab-ru">${escapeHtml(v.ru)}</span><span class="muted">${escapeHtml(v.en)}</span></div>`).join("") : ""}
      ${(!confusions.length && !strugglingVocab.length) ? `<p class="muted">Nothing flagged yet — keep practicing and patterns will show up here.</p>` : `<button type="button" class="btn sm" style="margin-top:10px;" onclick="startTargetedPractice()">Practice These Now</button>`}
    </div>

    <div class="card">
      <h3>Levels by the Numbers</h3>
      <table class="simple"><thead><tr><th>Level</th><th>Title</th><th>Lessons</th></tr></thead><tbody>
      ${LEVEL_META.slice(1).map((m,i)=>{
        const lvl=i+1; const lessons=lessonsForLevel(lvl); if(!lessons.length) return "";
        const done = lessons.filter(isLessonCompleted).length;
        return `<tr><td>${lvl}</td><td>${escapeHtml(m.title)}</td><td>${done}/${lessons.length}</td></tr>`;
      }).join("")}
      </tbody></table>
    </div>

    <div class="card">
      <h3>Settings</h3>
      <label style="display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;">
        <input type="checkbox" id="translit-toggle" ${Store.data.showTranslit?"checked":""} onchange="toggleTranslit(this.checked)">
        Show English-style pronunciation help (e.g. “pree-VYET”)
      </label>
      <p class="muted" style="margin-bottom:14px;">Turn this off once you're comfortable reading Cyrillic directly — that's the real goal.</p>
      <button type="button" class="btn" style="border-color:var(--error);color:var(--error);" onclick="confirmReset()">Reset All Progress</button>
    </div>
  `;
}
function toggleTranslit(checked){
  Store.data.showTranslit = checked;
  Store.save();
  document.body.classList.toggle("hide-translit", !checked);
}
function confirmReset(){
  if(confirm("This will permanently erase all your progress, XP, and review history on this device. This can't be undone. Continue?")){
    Store.reset();
    toast("Progress reset.");
    Router.show("dashboard");
  }
}
/* =========================================================================
   TOPBAR / THEME / INIT
   ========================================================================= */
function updateTopbar(){
  const s = document.getElementById("streak-num");
  const x = document.getElementById("xp-num");
  if(s) s.textContent = Store.data.streak;
  if(x) x.textContent = Store.data.xp;
}
function systemPrefersDark(){
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyTheme(){
  const t = Store.data.theme;
  if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
  else if(t==="light") document.documentElement.setAttribute("data-theme","light");
  else document.documentElement.removeAttribute("data-theme");
  const btn = document.getElementById("theme-toggle");
  const effectiveDark = t==="dark" || (!t && systemPrefersDark());
  if(btn) btn.textContent = effectiveDark ? "☀️" : "🌙";
}
function toggleTheme(){
  const effectiveDark = Store.data.theme==="dark" || (!Store.data.theme && systemPrefersDark());
  Store.data.theme = effectiveDark ? "light" : "dark";
  Store.save();
  applyTheme();
}
function init(){
  Store.load();
  Speech.init();
  applyTheme();
  document.body.classList.toggle("hide-translit", !Store.data.showTranslit);
  updateTopbar();
  document.addEventListener("click", function(e){
    const t = e.target.closest("[data-nav]");
    if(t) Router.show(t.dataset.nav);
  });
  const themeBtn = document.getElementById("theme-toggle");
  if(themeBtn) themeBtn.addEventListener("click", toggleTheme);
  window.addEventListener("keydown", function(e){
    if(e.key==="Enter"){
      const input = document.getElementById("type-input");
      if(input && document.activeElement===input) ExercisePlayer.submitType();
    }
  });
  Router.show("dashboard");
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
